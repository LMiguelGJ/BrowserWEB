[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
nodaemon=true
childlogdir=/tmp

[program:proxy-scraper]
command=/app/.venv/bin/proxy-scraper --recheck live --want 200 --serve --serve-host 127.0.0.1 --serve-refill 6 --no-datacenter --no-blocklisted
directory=/app/state
priority=10
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PROXY_SCRAPER_HOME="/app/state/data",PROXY_SCRAPER_NO_STAR_HINT="1",PROXY_SCRAPER_SERVE_PASSWORD="%(ENV_PROXY_SCRAPER_SERVE_PASSWORD)s"

[program:pyrock]
command=node /app/server.js
directory=/app
priority=20
autostart=true
autorestart=unexpected
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
